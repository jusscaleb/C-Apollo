name: Package Windows Installer

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  package:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 with MinGW and LLVM
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make

      - name: Build Apollo Compiler
        shell: msys2 {0}
        run: |
          cd "${{ github.workspace }}"
          bash run.sh

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Installer (.iss)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" apollo.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apollo_Setup_v3.0.0
          path: Output/*.exe
          if-no-files-found: error
